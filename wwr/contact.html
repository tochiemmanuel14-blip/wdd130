<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting Adventures for reservations, general inquiries, website suggestions, and customer support.">
    <meta name="author" content="Chimezie Emmanuel">
    <title>Contact Us | White Water Rafting Adventures</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="White Water Rafting Adventures Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="contact-info">
            <h2>Company Information</h2>

            <p><strong>Address:</strong> 123 River Road, Boise, Idaho, USA</p>
            <p><strong>Phone:</strong> +1 (208) 555-1234</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d23039.558541311242!2d-117.04659144832668!3d43.79475807584158!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54afc1d15438bac5%3A0xe257349f96861b1c!2sBoise%20River!5e0!3m2!1sen!2sng!4v1784665079777!5m2!1sen!2sng"
              width="400" height="300" loading="lazy" allowfullscreen
              title="Google Map showing the location of White Water Rafting Adventures">
            </iframe>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="John Smith, River Guide">
                <figcaption>John Smith &mdash; River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Sarah Johnson, Safety Instructor">
                <figcaption>Sarah Johnson &mdash; Safety Instructor</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="David Brown, Operations Manager">
                <figcaption>David Brown &mdash; Operations Manager</figcaption>
            </figure>

        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <div>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                </fieldset>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 White Water Rafting Adventures | Chimezie Emmanuel</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a>
        </nav>

    </footer>

</body>

</html>
